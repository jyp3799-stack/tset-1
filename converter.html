<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>단위 변환기</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #ffffff;
      color: #202124;
      padding: 30px 20px;
    }

    /* 상단 메뉴 */
    .nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 35px;
    }

    .nav a {
      text-decoration: none;
      color: #202124;
      border: 1px solid #dadce0;
      background: #f8f9fa;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 15px;
      transition: 0.2s;
    }

    .nav a:hover {
      background: #eeeeee;
    }

    .nav a.active {
      background: #1a73e8;
      color: white;
      border-color: #1a73e8;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 38px;
    }

    .converter {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      border: 1px solid #dadce0;
      border-radius: 10px;
      padding: 20px;
      background: white;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.07);
    }

    .category-select {
      width: 72%;
      height: 42px;
      padding: 0 10px;
      font-size: 16px;
      border: 1px solid #dadce0;
      background: #f8f9fa;
      color: #202124;
      margin-bottom: 20px;
    }

    .conversion-row {
      display: grid;
      grid-template-columns: 1fr 35px 1fr;
      align-items: center;
    }

    .unit-box {
      border: 1px solid #dadce0;
      border-radius: 4px;
      overflow: hidden;
    }

    .value-input {
      width: 100%;
      height: 60px;
      border: none;
      outline: none;
      text-align: center;
      font-size: 25px;
      background: white;
    }

    .unit-select {
      width: 100%;
      height: 38px;
      border: none;
      border-top: 1px solid #dadce0;
      background: #f1f3f4;
      padding: 0 8px;
      font-size: 14px;
    }

    .equals {
      text-align: center;
      font-size: 25px;
      color: #5f6368;
    }

    .formula {
      margin-top: 18px;
      font-size: 13px;
      color: #5f6368;
      min-height: 20px;
    }

    .formula-label {
      display: inline-block;
      padding: 3px 6px;
      margin-right: 5px;
      background: #f9ab00;
      color: white;
      border-radius: 3px;
      font-size: 11px;
    }

    @media (max-width: 600px) {
      .nav {
        flex-direction: column;
        align-items: center;
      }

      .nav a {
        width: 220px;
        text-align: center;
      }

      .category-select {
        width: 100%;
      }

      .conversion-row {
        grid-template-columns: 1fr 25px 1fr;
      }

      h1 {
        font-size: 30px;
      }

      .value-input {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- 상단 페이지 이동 메뉴 -->
  <div class="nav">
    <a href="index.html">세계 시계</a>
    <a href="converter.html" class="active">단위 변환기</a>
  </div>

  <h1>단위 변환기</h1>

  <div class="converter">

    <select id="category" class="category-select">
      <option value="length">길이</option>
      <option value="area">넓이</option>
      <option value="volume">부피</option>
      <option value="mass">질량</option>
      <option value="temperature">온도</option>
      <option value="time">시간</option>
      <option value="speed">속도</option>
      <option value="pressure">압력</option>
      <option value="energy">에너지</option>
    </select>

    <div class="conversion-row">

      <div class="unit-box">
        <input
          id="inputValue"
          class="value-input"
          type="number"
          value="1"
          step="any"
        >

        <select id="fromUnit" class="unit-select"></select>
      </div>

      <div class="equals">=</div>

      <div class="unit-box">
        <input
          id="outputValue"
          class="value-input"
          type="text"
          readonly
        >

        <select id="toUnit" class="unit-select"></select>
      </div>

    </div>

    <div id="formula" class="formula"></div>

  </div>


<script>

const unitData = {

  length: {
    units: {
      kilometer: { name: "킬로미터", factor: 1000 },
      meter: { name: "미터", factor: 1 },
      centimeter: { name: "센티미터", factor: 0.01 },
      millimeter: { name: "밀리미터", factor: 0.001 },
      micrometer: { name: "마이크로미터", factor: 0.000001 },
      nanometer: { name: "나노미터", factor: 0.000000001 },
      mile: { name: "마일", factor: 1609.344 },
      yard: { name: "야드", factor: 0.9144 },
      foot: { name: "피트", factor: 0.3048 },
      inch: { name: "인치", factor: 0.0254 }
    },
    defaultFrom: "meter",
    defaultTo: "centimeter"
  },

  area: {
    units: {
      squareKilometer: { name: "제곱킬로미터", factor: 1000000 },
      squareMeter: { name: "제곱미터", factor: 1 },
      squareCentimeter: { name: "제곱센티미터", factor: 0.0001 },
      hectare: { name: "헥타르", factor: 10000 },
      acre: { name: "에이커", factor: 4046.8564224 },
      pyeong: { name: "평", factor: 3.305785 }
    },
    defaultFrom: "squareMeter",
    defaultTo: "pyeong"
  },

  volume: {
    units: {
      cubicMeter: { name: "세제곱미터", factor: 1 },
      liter: { name: "리터", factor: 0.001 },
      milliliter: { name: "밀리리터", factor: 0.000001 },
      cubicCentimeter: { name: "세제곱센티미터", factor: 0.000001 },
      gallon: { name: "미국 갤런", factor: 0.003785411784 }
    },
    defaultFrom: "liter",
    defaultTo: "milliliter"
  },

  mass: {
    units: {
      tonne: { name: "톤", factor: 1000 },
      kilogram: { name: "킬로그램", factor: 1 },
      gram: { name: "그램", factor: 0.001 },
      milligram: { name: "밀리그램", factor: 0.000001 },
      pound: { name: "파운드", factor: 0.45359237 },
      ounce: { name: "온스", factor: 0.028349523125 }
    },
    defaultFrom: "kilogram",
    defaultTo: "gram"
  },

  temperature: {
    special: true,
    units: {
      celsius: { name: "섭씨" },
      fahrenheit: { name: "화씨" },
      kelvin: { name: "켈빈" }
    },
    defaultFrom: "celsius",
    defaultTo: "fahrenheit"
  },

  time: {
    units: {
      day: { name: "일", factor: 86400 },
      hour: { name: "시간", factor: 3600 },
      minute: { name: "분", factor: 60 },
      second: { name: "초", factor: 1 },
      millisecond: { name: "밀리초", factor: 0.001 }
    },
    defaultFrom: "hour",
    defaultTo: "minute"
  },

  speed: {
    units: {
      meterPerSecond: { name: "미터/초", factor: 1 },
      kilometerPerHour: { name: "킬로미터/시", factor: 0.2777777778 },
      milePerHour: { name: "마일/시", factor: 0.44704 },
      knot: { name: "노트", factor: 0.5144444444 }
    },
    defaultFrom: "kilometerPerHour",
    defaultTo: "meterPerSecond"
  },

  pressure: {
    units: {
      pascal: { name: "파스칼", factor: 1 },
      kilopascal: { name: "킬로파스칼", factor: 1000 },
      megapascal: { name: "메가파스칼", factor: 1000000 },
      bar: { name: "바", factor: 100000 },
      atmosphere: { name: "기압", factor: 101325 },
      psi: { name: "PSI", factor: 6894.757293 }
    },
    defaultFrom: "bar",
    defaultTo: "pascal"
  },

  energy: {
    units: {
      joule: { name: "줄", factor: 1 },
      kilojoule: { name: "킬로줄", factor: 1000 },
      calorie: { name: "칼로리", factor: 4.184 },
      kilocalorie: { name: "킬로칼로리", factor: 4184 },
      wattHour: { name: "와트시", factor: 3600 },
      kilowattHour: { name: "킬로와트시", factor: 3600000 }
    },
    defaultFrom: "kilojoule",
    defaultTo: "joule"
  }

};


const category = document.getElementById("category");
const fromUnit = document.getElementById("fromUnit");
const toUnit = document.getElementById("toUnit");

const inputValue = document.getElementById("inputValue");
const outputValue = document.getElementById("outputValue");
const formula = document.getElementById("formula");


function loadUnits() {

  const data = unitData[category.value];

  fromUnit.innerHTML = "";
  toUnit.innerHTML = "";

  Object.entries(data.units).forEach(([key, unit]) => {

    const option1 = document.createElement("option");
    option1.value = key;
    option1.textContent = unit.name;

    const option2 = document.createElement("option");
    option2.value = key;
    option2.textContent = unit.name;

    fromUnit.appendChild(option1);
    toUnit.appendChild(option2);

  });

  fromUnit.value = data.defaultFrom;
  toUnit.value = data.defaultTo;

  inputValue.value = 1;

  convert();
}


function convertTemperature(value, from, to) {

  let celsius;

  if (from === "celsius")
    celsius = value;

  if (from === "fahrenheit")
    celsius = (value - 32) * 5 / 9;

  if (from === "kelvin")
    celsius = value - 273.15;


  if (to === "celsius")
    return celsius;

  if (to === "fahrenheit")
    return celsius * 9 / 5 + 32;

  if (to === "kelvin")
    return celsius + 273.15;

}


function formatNumber(number) {

  if (!Number.isFinite(number))
    return "";

  return Number(number.toPrecision(12)).toLocaleString("ko-KR", {
    maximumFractionDigits: 10
  });

}


function convert() {

  const data = unitData[category.value];

  const value = parseFloat(inputValue.value);

  if (isNaN(value)) {
    outputValue.value = "";
    return;
  }

  let result;


  if (category.value === "temperature") {

    result = convertTemperature(
      value,
      fromUnit.value,
      toUnit.value
    );

    formula.innerHTML =
      `<span class="formula-label">공식</span>
      온도 변환 공식을 적용합니다.`;

  } else {

    const fromFactor =
      data.units[fromUnit.value].factor;

    const toFactor =
      data.units[toUnit.value].factor;

    result = value * fromFactor / toFactor;

    const ratio = fromFactor / toFactor;

    formula.innerHTML =
      `<span class="formula-label">공식</span>
      × ${formatNumber(ratio)}`;

  }

  outputValue.value = formatNumber(result);

}


category.addEventListener("change", loadUnits);
inputValue.addEventListener("input", convert);
fromUnit.addEventListener("change", convert);
toUnit.addEventListener("change", convert);

loadUnits();

</script>

</body>
</html>
